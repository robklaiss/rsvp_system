{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header" style="background-color: #2c3e50; color: white;">
            <h4 class="mb-0">Registro para {{ couple_names }}</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="firstname" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Apellido</label>
                    <input type="text" name="lastname" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Número de Teléfono</label>
                    <input type="tel" name="phone" class="form-control" 
                           pattern="\+\d{7,15}" 
                           placeholder="+595972123456"
                           required>
                    <small class="form-text text-muted">
                        Incluya el código de país (ejemplo: +595 para Paraguay)
                    </small>
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary w-100" style="background-color: #3498db; border-color: #3498db;">
                    Enviar Registro
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
